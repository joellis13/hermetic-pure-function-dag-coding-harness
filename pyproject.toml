[project]
name = "hermetic-pure-function-dag-coding-harness"
version = "0.1.0"
description = "Hermetic Pure-Function DAG AI Coding Harness"
readme = "README.md"
requires-python = ">=3.13, <3.14"
dependencies = [
    "pydantic>=2.0",
    "typer",
    "rich",
    "jinja2",
    "aiosqlite",
    "google-antigravity",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
hermetic = "hermetic.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hermetic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
